<!--meta {"label":"Avis client 5 étoiles","category":"Preuve sociale","mode":"overlay","duration":4,
"vars":{"stars":"5","quote":"J'ai vu la différence dès la première semaine.","author":"Camille, cliente vérifiée"},"tags":["ugc","avis","témoignage","étoiles","preuve","review"],
"usage":"Bulle d'avis : les étoiles s'allument une à une, la citation et l'auteur suivent. Idéal UGC / pub."}-->
<style>
.av{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(84%,calc(var(--u)*80));padding:calc(var(--u)*2.6) calc(var(--u)*3);
 border-radius:calc(var(--u)*2.4);background:#fff;color:#111;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*5) rgba(0,0,0,.35)}
.st{display:flex;gap:calc(var(--u)*.8)}
.st b{font-size:calc(var(--u)*4.4);color:#ddd;line-height:1}
.st b.on{color:#FFB800}
.q{font-weight:700;font-size:calc(var(--u)*3);line-height:1.3;margin-top:calc(var(--u)*1.2)}
.a{font-size:calc(var(--u)*1.6);opacity:.6;margin-top:calc(var(--u)*1)}
</style>
<template><div class="av"><div class="st" id="st"></div><div class="q">« {{quote}} »</div><div class="a mono">✓ {{author}}</div></div></template>
<script>
const st = document.getElementById("st");
for (let i = 0; i < 5; i++) { const b = document.createElement("b"); b.textContent = "★"; st.appendChild(b); }
tl.from(".av", { y: 40, opacity: 0, scale: .94, duration: .4, ease: "back.out(1.5)" }, 0);
[...st.children].forEach((b, i) => { if (i < +V.stars) tl.call(() => b.classList.add("on"), null, .35 + i * .12)
  .from(b, { scale: 1.6, duration: .2 }, .35 + i * .12); });
tl.from(".q", { opacity: 0, y: 12, duration: .35 }, 1.0).from(".a", { opacity: 0, duration: .3 }, 1.3)
  .to(".av", { y: -30, opacity: 0, duration: .35 }, V.DUR - .35);
</script>
