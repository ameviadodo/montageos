<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width={{W}}, height={{H}}">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(fonts/InstrumentSerif-Italic.ttf)}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Montserrat";font-weight:900;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:"Montserrat";font-weight:800;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:"Montserrat";font-weight:700;src:url(fonts/Montserrat-Bold.ttf)}
@font-face{font-family:"Montserrat";font-weight:600;src:url(fonts/Montserrat-SemiBold.ttf)}
@font-face{font-family:"Space Mono";src:url(fonts/SpaceMono-Regular.ttf)}
@font-face{font-family:"Space Mono";font-weight:700;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:"Fraunces";src:url(fonts/Fraunces.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;--u:{{U}}px;--accent:{{accent|#FFD935}};--ink:{{ink|#F4F2EC}};
  --night:#0B0F1A;--glass:rgba(20,26,40,.62);font-family:Montserrat,system-ui,sans-serif;color:var(--ink)}
.clip{position:absolute;inset:0}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
.mono{font-family:"Space Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
{{CSS}}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
<div id="scene" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
{{BODY}}
</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const V = {{VARS_JSON}};
const tl = gsap.timeline({ paused: true });
{{JS}}
window.__timelines["main"] = tl;
tl.seek(0);
if (location.search.includes("preview")) { tl.eventCallback("onComplete", () => setTimeout(() => tl.restart(), 700)); tl.play(); }
</script>
</body>
</html>
