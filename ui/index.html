<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonteurOS Studio</title>
<link rel="stylesheet" id="theme" href="/theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(255,217,53,.05),transparent 60%),var(--bg);color:var(--text);
  font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono)}
.cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cap.acc{color:var(--accent)}
.serif{font-family:var(--font-display);font-style:italic;font-weight:400}
.muted{color:var(--muted)}
.shell{max-width:1240px;margin:22px auto;border:1px solid var(--surface2);border-radius:calc(var(--radius) + 6px);
  background:color-mix(in srgb,var(--surface) 70%,transparent);min-height:calc(100vh - 44px);overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--surface2)}
.brand{font-weight:800;letter-spacing:.02em}.brand b{color:var(--accent)}
.brand small{font-weight:500;color:var(--muted);margin-left:8px}
header .sp{flex:1}
nav{display:flex;gap:4px}
nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:600}
nav a:hover{color:var(--text)}
nav a.on{background:var(--accent);color:var(--ink)}
.btn{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.y{background:var(--accent);color:var(--ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.jobpill{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);cursor:pointer;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobpill.run{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
main{padding:24px 26px 40px}
h1.page{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:40px;margin:0;line-height:1.1}
h1.page small{font-family:var(--font-mono);font-style:normal;font-size:13px;color:var(--muted);margin-left:8px}
.sub{color:var(--muted);margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat b{display:block;font-family:var(--font-mono);font-size:26px;font-weight:700}
.stat .cap{display:block;margin-top:2px}
.stat small{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:var(--radius);background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--surface2);margin-bottom:18px}
.filters input[type=search]{flex:1;min-width:200px}
input,select,textarea{background:var(--bg);border:1px solid var(--surface2);border-radius:10px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--text);font-size:13px;cursor:pointer}
label.chk input{accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--surface2));transform:translateY(-2px)}
.card .hd{display:flex;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.card .hd h3{margin:0;font-size:15px;font-weight:800}
.card .hd small{color:var(--muted);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:700}
.tag.fam{color:#7CC6FF;background:rgba(124,198,255,.1)}
.thumb{position:relative;aspect-ratio:16/9;background:#000 center/contain no-repeat}
.thumb .b{position:absolute;bottom:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25)}
.thumb .b.l{left:10px}.thumb .b.r{right:10px}
.ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.pill.y{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.pill.r{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.dotsep:before{content:"•";margin-right:6px;color:var(--accent2)}
.panel{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.panel>.cap{display:block;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.player{background:#000;border-radius:var(--radius);overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:300px;max-height:62vh}
.player video{max-width:100%;max-height:62vh;display:block}
.deliv{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-bottom:16px}
.deliv div{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--surface2);cursor:pointer;font-family:var(--font-mono);font-size:12px}
.deliv div.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.deliv small{color:var(--muted);display:block;font-size:10px}
.checks div{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--surface2);font-size:13px}
.checks i{font-style:normal;width:18px}
.checks span.muted{margin-left:auto;font-size:12px;text-align:right}
.actions .act{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--surface2)}
.actions .act p{margin:0;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:10px 12px}
td{padding:14px 12px;border-top:1px solid var(--surface2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--surface2) 40%,transparent)}
td .nm{font-weight:800}td .ds{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px}
.sw{display:inline-flex;gap:4px}.sw i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.12)}
.fonts{font-size:11px;color:var(--muted);line-height:1.6}.fonts b{font-family:var(--font-mono);font-weight:400;font-size:9px;letter-spacing:.15em;margin-right:4px}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--surface2)}
.tbl{border:1px solid var(--surface2);border-radius:var(--radius);background:var(--surface);margin-bottom:20px;overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:14px}
.cv{border-radius:12px;overflow:hidden;border:1px solid var(--surface2);background:var(--bg)}
.cv .vp{position:relative;aspect-ratio:16/9;overflow:hidden;background:repeating-conic-gradient(#0F1422 0 25%,#0B0F1A 0 50%) 0 0/24px 24px;max-height:420px;margin:0 auto}
.cv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.upbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}.upbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hist div{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--surface2);border-radius:10px;font-size:13px}
.hist div span{flex:1}.hist div small{color:var(--muted);font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.hist div:first-child{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
body.drag::after{content:"Dépose ta vidéo pour l'ajouter aux projets";position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;
  background:rgba(7,10,18,.85);color:var(--accent);display:flex;align-items:center;justify-content:center;font:800 26px var(--font-body);z-index:50}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.sheets a{display:block;text-decoration:none;border:1px solid var(--surface2);border-radius:10px;overflow:hidden;background:var(--bg)}
.sheets img{display:block;width:100%;height:140px;object-fit:cover}.sheets span{display:block;font-size:10px;padding:6px 8px;color:var(--muted)}
.chip{font:700 12px var(--font-mono);padding:5px 11px;border-radius:99px;border:1px solid var(--surface2);background:transparent;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.rt{font:700 10px var(--font-mono);padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);margin:0 4px 4px 0;display:inline-block}
.addbox{display:grid;grid-template-columns:200px 1fr 1fr auto;gap:10px;align-items:start;padding:14px;border-bottom:1px solid var(--surface2);background:color-mix(in srgb,var(--accent) 4%,transparent)}
.addbox textarea{min-height:42px;resize:vertical;width:100%}
.addbox .drop{border:1px dashed var(--muted);border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;display:block}
.addbox .drop.on{border-color:var(--accent);color:var(--accent)}
@media (max-width:900px){.addbox{grid-template-columns:1fr}}
@media (max-width:800px){.posegrid{grid-template-columns:1fr!important}}
.cv .meta{padding:10px 12px}
.cv code{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.cv .meta a{display:inline-block;margin-top:8px;font-weight:700;font-size:13px;cursor:pointer}
.group{margin:16px 0}
.group>h3{display:flex;gap:8px;align-items:center;font-size:15px;margin:0 0 4px;cursor:pointer}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(3,5,10,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:30px}
.modal.on{display:flex}
.modal .box{width:min(1100px,100%);background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);overflow:hidden}
.modal .bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--surface2)}
.modal .bar code{font-family:var(--font-mono);font-size:12px;color:var(--muted);flex:1}
.modal .stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:repeating-conic-gradient(#0F1422 0 25%,#0B0F1A 0 50%) 0 0/24px 24px}
.modal iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
.fb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:26px}
.ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ctl .btn{padding:6px 12px}
.ctl .tc{font-family:var(--font-mono);color:var(--accent);margin-left:6px}
.prog{height:6px;border-radius:99px;background:var(--surface2);margin-top:12px;position:relative;cursor:pointer}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#3B82F6,#93C5FD)}
.prog b{position:absolute;top:-4px;width:2px;height:14px;background:var(--accent)}
.fbl div{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--surface2);margin-bottom:8px;cursor:pointer}
.fbl div:hover{border-color:var(--muted)}
.fbl code{font-family:var(--font-mono);color:var(--accent);font-size:12px;white-space:nowrap}
.fbl p{margin:0;flex:1}
.fbl .x{color:var(--muted);cursor:pointer;padding:0 4px}
.kbd{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
.tscript{max-height:180px;overflow:auto;line-height:1.9;font-size:15px}
.tscript span{cursor:pointer;color:color-mix(in srgb,var(--text) 45%,transparent);border-radius:4px;padding:0 2px}
.tscript span.on{color:var(--accent)}
.tscript span.past{color:var(--text)}
.tl{position:relative;padding:14px 0 6px}
.tl .hdr{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;margin:0 0 10px 4px}
.tl .hdr:before{content:"●";color:var(--accent);margin-right:8px}
.trk{display:grid;grid-template-columns:110px 1fr;align-items:center;min-height:34px}
.trk>span{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;line-height:1.2}
.lane{position:relative;height:26px;border-radius:6px;background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.blk{position:absolute;top:3px;height:20px;border-radius:5px;font-size:10px;font-weight:800;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer;color:var(--ink)}
.blk.sub{background:var(--accent)}.blk.br{background:#7CC6FF}.blk.zm{background:#B794F6}.blk.an{background:#F59E0B}
.blk.cut{background:var(--danger);opacity:.85;width:4px!important;padding:0}
.blk.tr{background:#5EEAD4;width:auto!important;min-width:14px;padding:0 4px;transform:translateX(-50%)}
.blk.fx{background:var(--surface);color:var(--muted);border:1px solid var(--surface2);border-radius:99px}
.head{position:absolute;top:30px;bottom:0;width:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 12px var(--accent)}
.head:before{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:8px;border-radius:2px;background:var(--accent)}
.ent{background:var(--bg);border:1px solid var(--surface2);border-radius:12px;padding:10px;margin-bottom:8px}
.ent.sel{border-color:var(--accent)}
.ent label{font-size:11px;color:var(--muted);display:block;margin-top:6px}
.ent input,.ent select{width:100%;padding:6px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.log{background:#03050A;color:#A7F3D0;border-radius:10px;padding:10px;font:12px var(--font-mono);max-height:200px;overflow:auto;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:50px 0}
.md h1,.md h2{font-family:var(--font-display);font-style:italic;font-weight:400}
.md pre{background:#03050A;padding:12px;border-radius:10px;overflow:auto;font:12px var(--font-mono)}
.md code{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
@media (max-width:980px){.split,.fb,.editor{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.shell{margin:0;border-radius:0}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">Monteur<b>OS</b><small>système de montage</small></div>
    <div class="sp"></div>
    <span class="jobpill" id="jobpill" title="Activité">prêt</span>
    <nav id="nav">
      <a href="#/projets" data-v="projets">Projets</a>
      <a href="#/studio" data-v="studio">Studio</a>
      <a href="#/bibliotheques" data-v="bibliotheques">Bibliothèques</a>
      <a href="#/activite" data-v="activite">Activité</a>
    </nav>
    <button class="btn ghost" id="refresh">Actualiser</button>
  </header>
  <main id="view"></main>
</div>
<div class="modal" id="modal"><div class="box">
  <div class="bar"><code id="mcode"></code><button class="btn" id="mreplay">Rejouer</button><button class="btn" id="mtab">Onglet</button><button class="btn" id="mclose">Fermer</button></div>
  <div class="stage" id="mstage"><iframe id="mframe"></iframe></div>
</div></div>
<div class="modal" id="posedlg"><div class="box" style="width:min(980px,100%)">
  <div class="bar"><code id="pcode"></code><button class="btn" id="pclose">Fermer</button></div>
  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:18px;padding:18px" class="posegrid">
    <div><select id="pproj" style="width:100%;margin-bottom:10px"></select>
      <div class="player" style="min-height:200px"><video id="pvid" controls playsinline style="max-height:46vh"></video></div>
      <p class="muted" style="font-size:12px">Mets la vidéo à l'endroit voulu : la carte démarre à cet instant.</p></div>
    <div><label class="cap">Début (s)</label><input id="pstart" type="number" step="0.1" min="0" value="0" style="width:100%">
      <label class="cap" style="display:block;margin-top:10px">Durée (s, vide = celle de la carte)</label><input id="pdur" type="number" step="0.1" min="0.5" style="width:100%">
      <div id="pvars"></div>
      <label class="chk" style="display:block;margin-top:12px"><input type="checkbox" id="pdraft" checked> Refaire un draft pour la voir dans la vidéo</label>
      <div class="row" style="margin-top:14px"><button class="btn" id="pprev">Aperçu</button><button class="btn y" id="pgo">Poser la carte</button></div>
      <div class="log" id="joblog" style="margin-top:10px;max-height:120px">—</div></div>
  </div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const api = (u, body) => fetch(u, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {})
  .then(r => r.json()).catch(() => ({error: "Le Studio ne répond pas : relance bin/monteur studio dans le terminal"}));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = ts => { if (!ts) return "—"; const d = Date.now() / 1000 - ts;
  return d < 60 ? "à l'instant" : d < 3600 ? `il y a ${Math.round(d / 60)} min` : d < 86400 ? `il y a ${Math.round(d / 3600)} h` : `il y a ${Math.round(d / 86400)} jours`; };
const size = b => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB";
const tc = t => { t = Math.max(0, t || 0); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${(t % 60).toFixed(2).padStart(5, "0")}`; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), Math.max(2200, String(m).length * 55)); };
const STATE = {last: null, job: null};
const statusPill = s => `<span class="pill ${s === "prêt à relire" ? "ok" : s === "livré" ? "y" : ""}">${esc(s)}</span>`;

// ---------- tâches ----------
async function run(action, extra = {}, then) {
  const job = await api("/api/run", {action, ...extra});
  if (job.error) return toast(job.error);
  STATE.job = job.id; toast(job.label + "…");
  const tick = async () => {
    const j = await api("/api/job?id=" + job.id);
    const pill = $("#jobpill");
    pill.textContent = j.status === "running" ? `${j.label} · ${(j.log.at(-1) || "").replace("[monteur] ", "")}` : `${j.label} ${j.status === "done" ? "✓" : "✗"}`;
    pill.classList.toggle("run", j.status === "running");
    const lg = $("#joblog"); if (lg) { lg.textContent = j.log.join("\n"); lg.scrollTop = 1e9; }
    if (j.status === "running") return setTimeout(tick, 1000);
    toast(j.status === "done" ? `${j.label} terminé ✓` : `${j.label} : erreur — ${(j.log.at(-1) || "").replace("[monteur] ", "")}`);
    STATE.sel = null;  // le lecteur repasse sur le rendu le plus récent
    then ? then(j) : route();
  };
  tick();
}

// ---------- routeur ----------
async function route() {
  const [, view = "projets", ...rest] = location.hash.split("/");
  const arg = decodeURIComponent(rest.join("/"));

const API_VERSION = 4;
async function checkServer() {
  let st; try { st = await api("/api/state"); } catch (e) { return; }
  const old = (st.api || 0) < API_VERSION || st.outdated;
  let bar = $("#upd");
  if (!old) return bar && bar.remove();
  if (bar) return;
  bar = document.createElement("div"); bar.id = "upd"; bar.className = "panel";
  bar.style.cssText = "margin:12px 22px 0;border-color:var(--accent);display:flex;gap:12px;align-items:center;flex-wrap:wrap";
  bar.innerHTML = `<b>MonteurOS a été mis à jour.</b><span class="muted">Le Studio tourne encore avec l'ancienne version : redémarre-le pour tout voir.</span><button class="btn y" id="rst">Redémarrer le Studio</button>`;
  $("header").after(bar); $("#rst").onclick = restartServer;
}
async function restartServer() {
  const before = (await api("/api/state")).boot;
  const r = await api("/api/restart", {});
  if (r.error) return toast(r.error === "introuvable" ? "Ce Studio est trop ancien pour se relancer seul : Ctrl+C dans le terminal, puis bin/monteur studio" : r.error);
  toast("Redémarrage du Studio…");
  for (let i = 0; i < 60; i++) {  // on attend le NOUVEAU Studio (identifiant de démarrage différent)
    await new Promise(ok => setTimeout(ok, 500));
    try { const st = await fetch("/api/state", {cache: "no-store"}).then(x => x.json());
      if (st.boot && st.boot !== before && st.api >= API_VERSION) { toast("Studio redémarré ✓"); return setTimeout(() => location.reload(), 400); } } catch (e) {}
  }
  toast("Le Studio ne répond pas : Ctrl+C dans le terminal, puis bin/monteur studio");
}

async function undoAction(video, n) {

  if (!what.length) return toast("Rien à annuler");
  if (n && what.length > 1 && !confirm(`Annuler ces ${what.length} actions ?\n\n• ${what.join("\n• ")}`)) return;
  const r = await api("/api/undo", {video, n});

function sendFile(url, file, onProgress) {  // envoi avec progression (XHR : fetch ne donne pas l'avancement)
  return new Promise(ok => { const x = new XMLHttpRequest(); x.open("POST", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    x.onload = () => { try { ok(JSON.parse(x.responseText)); } catch (e) { ok({error: "réponse illisible"}); } };
    x.onerror = () => ok({error: "envoi interrompu"}); x.send(file); });
}
async function uploadFiles(files, kind, name) {

    toast(`Envoi de ${f.name} (${size(f.size)})…`);
    const r = await sendFile(`/api/upload?kind=${kind}&name=${encodeURIComponent(name)}&filename=${encodeURIComponent(f.name)}`, f);
    if (r.error) { toast(r.error); return null; }
    out.push(r.path);
  }
  return out;
}
async function addRushes(files) {  // vidéos choisies sur l'ordinateur → nouveaux projets
  files = [...files].filter(f => /\.(mp4|mov|mkv|webm|m4v)$/i.test(f.name));
  if (!files.length) return toast("Choisis un fichier vidéo (mp4, mov, mkv, webm, m4v)");
  const bar = $("#upbar"), lab = $("#uplab"); if (bar) bar.parentElement.hidden = false;
  let last = null;
  for (const [k, f] of files.entries()) {
    if (lab) lab.textContent = `Ajout de ${f.name} (${size(f.size)}) — ${k + 1}/${files.length}`;
    const r = await sendFile(`/api/upload?kind=rush&filename=${encodeURIComponent(f.name)}`, f, x => bar && (bar.style.width = Math.round(x * 100) + "%"));
    if (r.error) { toast(r.error); break; }
    last = r.video; toast(`${r.video} ajoutée ✓`);

  if (last) location.hash = "#/projet/" + encodeURIComponent(last); else route();
}
function addBox(id, title, hint, button, extra = "") {
  return `<div class="addbox" id="${id}"><div><b>${title}</b><div class="muted" style="font-size:12px;margin-top:4px">${hint}</div></div>
    <div><input class="nm" placeholder="Nom (ex. mrbeast, ma-marque)" style="width:100%;margin-bottom:8px"><textarea class="links" placeholder="Liens YouTube, Shorts, TikTok, Instagram, Vimeo… (un par ligne)"></textarea></div>
    <div><label class="btn" style="display:block;text-align:center;margin-bottom:8px">📁 Choisir une vidéo sur l'ordinateur<input type="file" class="files" accept="video/*,image/*" multiple hidden></label>
      <div class="drop">…ou glisse ici des MP4 / captures</div><div class="fl muted mono" style="font-size:11px;margin-top:6px"></div>${extra}</div>
    <div><button class="btn y go">${button}</button></div></div>`;
}
function bindAddBox(id, kind, action, extra = () => ({})) {
  const box = $("#" + id); if (!box) return; let files = [];
  const show = () => box.querySelector(".fl").textContent = files.map(f => f.name).join(" · ");
  const drop = box.querySelector(".drop");
  box.querySelector(".files").onchange = e => { files = [...e.target.files]; show(); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("on"); };
  drop.ondragleave = () => drop.classList.remove("on");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("on"); files = [...e.dataTransfer.files]; show(); };
  box.querySelector(".go").onclick = async () => {
    const name = box.querySelector(".nm").value.trim(), links = box.querySelector(".links").value.split(/\s+/).filter(x => /^https?:\/\//.test(x));
    if (!name) return toast("Donne un nom");
    if (!links.length && !files.length) return toast("Ajoute au moins un lien ou un fichier MP4");
    const up = files.length ? await uploadFiles(files, kind, name) : [];
    if (up === null) return;
    run(action, {sources: [...links, ...up], name, ...extra(box)}, () => { STATE.lib = null; vBiblio(); });
  };
}
async function vBiblio() {
  const L = STATE.lib = await api("/api/library");
  if (L.error) throw new Error(L.error);
  L.aspects = L.aspects || Object.keys(RATIO); L.cuts = L.cuts || {}; L.active_style = L.active_style || "default";
  L.formats.forEach(f => f.ratios = f.ratios || ["9:16"]);
  L.references.forEach(r => { r.ratios = r.ratios || []; r.sources = r.sources || []; r.cut = r.cut || "hard"; });
  const cats = [...new Set(L.cards.map(c => c.category))];
  $("#view").innerHTML = `
    <div class="row" style="justify-content:space-between"><div><h1 class="page">Bibliothèques</h1>
      <p class="sub">Les formats de reel, la bibliothèque de styles et le registre des assets.</p></div>
      <div class="row"><a class="btn ghost" href="#cartes" id="tocards">Cartes animées</a><a class="btn ghost" href="#refs" id="torefs">Tous les styles</a></div></div>
    <div class="chips" style="margin:0 0 16px"><span class="cap" style="margin-right:6px">Format</span>
      ${["", ...L.aspects].map(r => `<button class="chip ${LIBF.ratio === r ? "on" : ""}" data-ratio="${r}">${r || "Tous"}</button>`).join("")}</div>
    <div class="tbl"><div class="sec-h"><span class="cap acc">Formats de reel</span><span class="cap">la structure d'un reel · <span class="acc">guide</span> · <span class="acc">mesures</span></span></div>
      <table><tr><th>#</th><th>Format</th><th>Ratios</th><th>État</th><th>Squelette</th><th>Style</th></tr>
      ${L.formats.filter(f => matchRatio(f.ratios)).map(f => `<tr class="click" data-fmt="${f.id}"><td class="mono muted">${esc(f.numero)}</td><td><div class="nm">${esc(f.nom)}</div><div class="ds">${esc(f.description)}</div></td>
        <td>${ratioChips(f.ratios)}</td><td><b>${esc(f.etat)}</b></td><td class="mono">${esc(f.squelette)}</td><td class="mono muted">${esc(f.style)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="empty">Aucun format en ${esc(LIBF.ratio)}.</td></tr>`}</table></div>
    <div class="tbl"><div class="sec-h"><span class="cap acc">Ta charte</span><span class="cap">thème de l'interface + identité des vidéos</span></div>
      ${addBox("addcharte", "Ajouter une charte", "Depuis un lien vidéo, un petit extrait MP4 ou des captures : palette → thème du Studio + style vidéo assorti.", "Extraire la charte")}
      <table><tr><th>#</th><th>Nom</th><th>Palette</th><th>Polices</th><th></th></tr>
      ${L.charte.map((t, i) => `<tr><td class="mono muted">${String(i + 1).padStart(2, "0")}</td><td><span class="nm">${esc(t.name)}</span> ${t.active ? '<span class="pill y">TA CHARTE</span>' : ""}<div class="ds">${esc((t.notes || "").slice(0, 120))}</div></td>
        <td>${sw(Object.values(t.colors).slice(0, 7))}</td><td>${fontsCell(t.fonts)}</td><td>${t.active ? "" : `<button class="btn" data-theme="${t.name}">Activer</button>`}</td></tr>`).join("")}</table></div>
    <div class="tbl" id="refs"><div class="sec-h"><span class="cap acc">Références</span><span class="cap">${L.references.length} styles · ${L.cards.length} cartes · actif : <span class="acc">${esc(L.active_style)}</span></span></div>
      ${addBox("addstyle", "Cloner un style viral", "Colle les liens des vidéos qui cartonnent (ou dépose des MP4) : rythme, cuts, zooms, couleurs, sous-titres → un style prêt à l'emploi.", "Cloner le style",
        `<label class="chk" style="display:block;margin-top:8px;font-size:13px"><input type="checkbox" class="act" checked> Activer après la copie</label>`)}
      <table><tr><th>#</th><th>Nom</th><th>État</th><th>Ratios</th><th>Cut</th><th>Cartes</th><th>Palette</th><th>Polices</th><th></th></tr>
      ${L.references.filter(s => matchRatio(s.ratios)).map((s, i) => `<tr class="click" data-style="${s.name}"><td class="mono muted">${String(i + 1).padStart(2, "0")}</td>
        <td><div class="nm">${esc(s.name)} ${s.active ? '<span class="pill y">ACTIF</span>' : ""}</div><div class="ds">${esc(s.description).slice(0, 90)}</div></td>
        <td><span class="pill ${s.etat === "Ta charte" ? "y" : s.etat === "Copié" ? "ok" : ""}">${esc(s.etat)}</span></td><td>${ratioChips(s.ratios)}</td>
        <td class="mono muted" style="font-size:12px">${esc(s.cut)}</td><td class="mono" style="white-space:nowrap">${s.cards.length} cartes</td>
        <td>${sw(s.palette)}</td><td>${fontsCell(s.fonts)}</td><td>${s.active ? "" : `<button class="btn" data-activate="${s.name}">Activer</button>`}</td></tr>`).join("")}</table></div>
    <div class="tbl" id="cartes"><div class="sec-h"><span class="cap acc">Cartes animées</span><span class="cap">compositions Hyperframes · aperçu ${esc(LIBF.ratio || "16:9")}</span></div>
      <div class="row" style="padding:14px 14px 0"><input type="search" id="cq" placeholder="Rechercher une carte : chiffre, prix, avis, nom, liste, intro, transition…" value="${esc(LIBF.q)}" style="flex:1;min-width:240px">
        <span class="mono muted" id="ccount"></span></div>
      <div class="chips" style="padding:10px 14px 0">${["", ...cats].map(c => `<button class="chip ${LIBF.cat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c || "Toutes")}</button>`).join("")}</div>
      <div id="cgroups"></div></div>`;
  $$("[data-fmt]").forEach(r => r.onclick = () => location.hash = "#/format/" + r.dataset.fmt);
  $$("[data-style]").forEach(r => r.onclick = e => { if (!e.target.closest("button")) location.hash = "#/style/" + r.dataset.style; });
  $$("[data-theme]").forEach(b => b.onclick = async () => { await api("/api/theme", {theme: b.dataset.theme}); $("#theme").href = "/theme.css?t=" + Date.now(); vBiblio(); });
  $$("[data-activate]").forEach(b => b.onclick = async () => { const r = await api("/api/style/activate", {name: b.dataset.activate}); toast(r.error || `Style « ${b.dataset.activate} » activé pour les nouveaux projets`); await vBiblio(); if (!r.error) applyToProjects(b.dataset.activate); });
  $$("[data-ratio]").forEach(b => b.onclick = () => { LIBF.ratio = b.dataset.ratio; saveLibf(); vBiblio(); });
  $$("[data-cat]").forEach(b => b.onclick = () => { LIBF.cat = b.dataset.cat; saveLibf(); $$("[data-cat]").forEach(x => x.classList.toggle("on", x === b)); drawCards(L.cards); });
  $("#cq").oninput = e => { LIBF.q = e.target.value; saveLibf(); clearTimeout($("#cq")._t); $("#cq")._t = setTimeout(() => drawCards(L.cards), 180); };
  $("#tocards").onclick = e => { e.preventDefault(); $("#cartes").scrollIntoView({behavior: "smooth"}); };
  $("#torefs").onclick = e => { e.preventDefault(); $("#refs").scrollIntoView({behavior: "smooth"}); };
  bindAddBox("addcharte", "charte", "charte");
  bindAddBox("addstyle", "style", "style", box => ({activer: box.querySelector(".act").checked}));
  drawCards(L.cards);
}
function searchCards(cards, q = LIBF.q, cat = LIBF.cat) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  return cards.filter(c => (!cat || c.category === cat) && words.every(w => norm([c.id, c.label, c.category, c.usage, ...(c.tags || []),
    ...Object.entries(c.vars || {}).flat()].join(" ")).includes(w)));
}
function drawCards(cards) {
  const found = searchCards(cards);
  $("#ccount").textContent = `${found.length} / ${cards.length}`;
  $("#cgroups").innerHTML = found.length ? groups(found) : `<div class="empty">Aucune carte pour « ${esc(LIBF.q)} ». Demande à Claude d'en créer une (skill monteur-bibliotheque).</div>`;
  bindCards(); fitFrames();
}
function groups(cards, prefix = "") {
  const by = {}; cards.forEach(c => (by[c.category] = by[c.category] || []).push(c));
  return Object.entries(by).map(([cat, cs]) => `<div class="group" style="padding:0 14px"><h3 data-tog>▾ ${esc(cat)} <span class="count">${cs.length}</span></h3>
    <div class="cards" style="padding:8px 0">${cs.map(c => cardTile(c, prefix)).join("")}</div></div>`).join("");
}
function bindCards() {
  $$("[data-open]").forEach(a => a.onclick = () => openCard(a.dataset.open));
  $$("[data-pose]").forEach(a => a.onclick = () => poseCard(a.dataset.pose));
  $$("[data-tog]").forEach(h => h.onclick = () => { const n = h.nextElementSibling; n.hidden = !n.hidden; h.firstChild.textContent = (n.hidden ? "▸ " : "▾ ") + h.firstChild.textContent.slice(2); });
}
function openCard(id, vars = {}) {
  STATE.card = [id, vars]; $("#mcode").textContent = id; $("#mframe").src = cardFrame(id, vars);
  $("#modal").classList.add("on"); fitModal();
}
async function poseCard(id) {  // carte de la bibliothèque → posée sur une vidéo précise
  $("#modal").classList.remove("on");
  const lib = STATE.lib || (STATE.lib = await api("/api/library"));
  const c = lib.cards.find(x => x.id === id); if (!c) return;
  const d = await api("/api/projects"); const ps = (d.projects || []).filter(x => x.status !== "brut");
  if (!ps.length) return toast("Aucun projet préparé : ajoute une vidéo puis « Préparer »");
  $("#pcode").textContent = `${c.label} · ${c.id}`;
  $("#pproj").innerHTML = ps.map(x => `<option>${esc(x.video)}</option>`).join("");
  if (STATE.p && ps.some(x => x.video === STATE.p.video)) $("#pproj").value = STATE.p.video;
  $("#pvars").innerHTML = Object.entries(c.vars || {}).map(([k, v]) => `<label class="cap" style="display:block;margin-top:10px">${esc(k)}</label><input data-pv="${esc(k)}" style="width:100%" value="${esc(v)}">`).join("");
  const load = async () => { const p = await api("/api/project?video=" + encodeURIComponent($("#pproj").value));
    $("#pvid").src = (p.renders.at(-1) || {}).url || p.files.cut || p.files.source; $("#pvid").dataset.video = p.video; };
  $("#pproj").onchange = load; await load();
  const follow = () => $("#pstart").value = $("#pvid").currentTime.toFixed(1);
  $("#pvid").ontimeupdate = follow; $("#pvid").onseeked = follow; $("#pvid").onpause = follow;
  const vals = () => Object.fromEntries($$("#pvars [data-pv]").map(i => [i.dataset.pv, i.value]));
  $("#pprev").onclick = () => { $("#posedlg").classList.remove("on"); openCard(id, vals()); };
  $("#pgo").onclick = () => { const video = $("#pproj").value, body = {video, card: id, start: +$("#pstart").value, vars: vals()};
    if (+$("#pdur").value) body.duree = +$("#pdur").value;
    const draft = $("#pdraft").checked;
    run("carte", body, j => { if (j.status !== "done") return;
      const go = () => { $("#posedlg").classList.remove("on"); STATE.sel = null; location.hash = "#/projet/" + encodeURIComponent(video); };
      draft ? run("render", {video, draft: true}, go) : go(); }); };
  $("#pclose").onclick = () => { $("#pvid").pause(); $("#posedlg").classList.remove("on"); };
  $("#posedlg").classList.add("on");
}
function fitModal() { const st = $("#mstage"), f = $("#mframe"); if (!st) return; const [W, H] = dims();
  st.style.aspectRatio = `${W}/${H}`; st.style.width = `min(100%, calc(76vh * ${W} / ${H}))`; st.style.margin = "0 auto";
  f.style.width = W + "px"; f.style.height = H + "px"; if (st.offsetWidth) f.style.transform = `scale(${st.offsetWidth / W})`; }
$("#mclose").onclick = () => { $("#modal").classList.remove("on"); $("#mframe").src = "about:blank"; };
$("#mreplay").onclick = () => $("#mframe").src = cardFrame(...STATE.card);
$("#mtab").onclick = () => window.open(cardFrame(...STATE.card), "_blank");
$("#modal").onclick = e => { if (e.target.id === "modal") $("#mclose").click(); };

async function vStyle(name) {
  const s = await api("/api/style?name=" + encodeURIComponent(name));
  $("#view").innerHTML = `<a class="back" href="#/bibliotheques">← Bibliothèques</a>
    <h1 class="page" style="margin-top:6px">${esc(name)}</h1>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <p class="sub" style="max-width:640px">${esc(s.description)}</p>
      <div class="row"><select id="applyp"><option value="">Appliquer à un projet…</option>${(STATE.projects || []).map(x => `<option>${esc(x.video)}</option>`).join("")}</select>
        <button class="btn" id="applyb">Appliquer</button>
        ${s.active ? '<span class="pill y">STYLE ACTIF</span>' : '<button class="btn y" id="activate">Activer ce style</button>'}<button class="btn ghost" id="hidev">Masquer les variantes</button><button class="btn ghost" id="openall">Tout ouvrir</button><span class="mono muted">${s.cards.length} cartes</span></div></div>
    <div class="row" style="margin-bottom:10px">${sw(s.palette)} ${fontsCell(s.fonts)}</div>
    ${s.sources.length ? `<div class="row muted" style="font-size:12px;margin-bottom:6px">Copié de : ${s.sources.map(u => /^https?:/.test(u) ? `<a href="${esc(u)}" target="_blank">${esc(u)}</a>` : `<span class="mono">${esc(u.split(/[\\/]/).pop())}</span>`).join(" · ")}</div>` : ""}
    <div class="row muted mono" style="font-size:12px;margin-bottom:6px">format ${esc(s.format)} · ratios ${esc(s.ratios.join(", ") || "tous")} · cut ${esc(s.cut)}${s.layout ? " · layout " + esc(s.layout) : ""} · <span class="acc" style="color:var(--accent)">bin/monteur prep RUSH.mp4 --style ${esc(name)}</span></div>
    ${s.refinable || s.affinage ? `<div class="panel" style="margin-top:14px"><div class="row" style="justify-content:space-between"><span class="cap acc">Affinage du style copié</span>
        <div class="row">${s.refinable ? '<button class="btn y" id="refine">Affiner automatiquement</button>' : ""}<button class="btn" id="askclaude">⧉ Copier pour Claude</button></div></div>
      ${s.affinage ? refineReport(s.affinage) : '<p class="muted">Pas encore affiné : MonteurOS va mesurer les vrais types de cut, les zooms et la place, la taille et les couleurs des sous-titres de la référence.</p>'}
      ${s.sheets.length ? `<div class="sheets">${s.sheets.map(x => `<a href="${x.url}" target="_blank" title="${esc(x.name)}"><img loading="lazy" src="${x.url}"><span class="mono">${esc(x.name)}</span></a>`).join("")}</div>` : ""}
      <div class="log" id="joblog" style="margin-top:10px;display:none"></div></div>` : ""}
    ${s.cards.length ? groups(s.cards, name + ".") : '<div class="empty">Aucune carte associée à ce style.</div>'}
    <details class="panel" style="margin-top:16px"><summary class="cap" style="cursor:pointer">Réglages (styles/${esc(name)}.json)</summary><pre class="log" style="max-height:420px">${esc(JSON.stringify(s.json, null, 2))}</pre></details>`;
  bindCards(); fitFrames();
  $("#refine") && ($("#refine").onclick = () => { $("#joblog").style.display = "block"; run("affiner", {name}, () => vStyle(name)); });
  $("#askclaude") && ($("#askclaude").onclick = async () => {
    const txt = `Affine le style MonteurOS « ${name} » (skill monteur-copie-style) : regarde les planches de styles/refs/${name}/ ` +
      `(affinage.png = bande des sous-titres détectée, contact_sheet.png, burst.png, frame_*.png), vérifie styles/${name}.json ` +
      `(police exacte, majuscules, cartouche, couleurs, cut.transition, zooms, cartes de la bibliothèque) et corrige ce qui ne colle pas.` +
      (s.affinage ? `\nMesures auto : ${JSON.stringify(s.affinage)}` : "");
    try { await navigator.clipboard.writeText(txt); toast("Copié : colle-le dans Claude"); } catch (e) { prompt("Copie ce texte pour Claude :", txt); } });
  if (!STATE.projects) api("/api/projects").then(d => { STATE.projects = d.projects || [];
    $("#applyp") && ($("#applyp").innerHTML = '<option value="">Appliquer à un projet…</option>' + STATE.projects.map(x => `<option>${esc(x.video)}</option>`).join("")); });
  $("#applyb").onclick = () => { const v = $("#applyp").value; if (!v) return toast("Choisis le projet");
    run("appliquer", {video: v, style: name}, j => { if (j.status === "done") location.hash = "#/projet/" + encodeURIComponent(v); }); };
  $("#activate") && ($("#activate").onclick = async () => { await api("/api/style/activate", {name}); toast(`Style « ${name} » activé pour les nouveaux projets`); await vStyle(name); applyToProjects(name); });
  $("#hidev").onclick = () => $$(".cards").forEach(c => c.hidden = true);
  $("#openall").onclick = () => $$(".cards").forEach(c => c.hidden = false);
}
function refineReport(a) {
  const st = a.sous_titres || {}, cuts = a.coupes || {};
  const rows = [["Coupes", Object.entries(cuts).map(([k, v]) => `${k} × ${v}`).join(" · ") || "—"],
    ["Zooms", a.zooms_par_minute != null ? `${a.zooms_par_minute} / min` : "—"],
    ["Sous-titres", st.found ? `bande ${Math.round(st.band[0] * 100)}–${Math.round(st.band[1] * 100)} % de la hauteur · taille ${st.size} · ${st.max_words || "?"} mots / bloc` : "aucun sous-titre incrusté détecté (ceux du style sont gardés)"],
    ["Couleurs", st.found ? `${sw([st.primary, st.accent].filter(Boolean))} ${esc(st.primary || "")} ${st.accent && st.accent !== st.primary ? "+ " + esc(st.accent) : ""}` : "—"]];
  return `<table style="margin:8px 0">${rows.map(([k, v]) => `<tr><td class="cap" style="width:140px">${k}</td><td>${v}</td></tr>`).join("")}</table>`;
}
function md(src) {
  const blocks = src.split(/```(?:\w+)?\n([\s\S]*?)```/g);
  return blocks.map((b, i) => i % 2 ? `<pre>${esc(b)}</pre>` : esc(b)
    .replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/^(\d+)\. (.*)$/gm, "<div>$1. $2</div>").replace(/^- (.*)$/gm, "<div>• $1</div>").replace(/\n{2,}/g, "<br><br>")).join("");
}
async function vFormat(id) {
  const f = await api("/api/format?id=" + encodeURIComponent(id));
  const L = STATE.lib || (STATE.lib = await api("/api/library")); const meta = L.formats.find(x => x.id === id) || {};
  $("#view").innerHTML = `<a class="back" href="#/bibliotheques">← Bibliothèques</a>
    ${meta.exemple ? `<div class="row" style="justify-content:space-between;margin-top:10px"><span class="cap">Exemple rendu · référence</span><a class="back" href="${meta.exemple}" target="_blank">ouvrir le mp4</a></div>
      <div class="player" style="max-width:360px;margin:10px 0 20px"><video controls src="${meta.exemple}"></video></div>` : ""}
    <div class="cap" style="margin-top:10px">formats/${esc(id)}.md</div><div class="md panel" style="margin-top:10px">${md(f.body)}</div>`;
}

  const a = await api("/api/activity");
  $("#view").innerHTML = `<h1 class="page">Activité</h1><p class="sub">Tout ce que MonteurOS a lancé depuis le Studio — préparations, rendus, vérifications, cartes, retours.</p>
    ${a.running.map(j => `<div class="panel"><div class="row"><span class="pill y">en cours</span><b>${esc(j.label)}</b><span class="mono muted">${esc(j.video || "")}</span></div><div class="log" id="joblog" style="margin-top:10px">…</div></div>`).join("")}
    <div class="tbl"><table><tr><th>Quand</th><th>Action</th><th>Projet</th><th>État</th><th>Durée</th><th>Dernières lignes</th></tr>

      <td>${i.status === "done" ? '<span class="pill ok">terminé</span>' : i.status === "error" ? '<span class="pill r">erreur</span>' : i.status === "interrupted" ? '<span class="pill">interrompu</span>' : '<span class="pill y">en cours</span>'}</td>
      <td class="mono muted">${i.ended ? (i.ended - i.started) + " s" : "—"}</td><td class="mono muted" style="font-size:11px;max-width:380px">${esc((i.tail || []).slice(-2).join(" · ").replace(/\[monteur\] /g, ""))}</td></tr>`).join("")
      || `<tr><td colspan="6" class="empty">Rien pour l'instant.</td></tr>`}</table></div>`;
}
