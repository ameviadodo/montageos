<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonteurOS Studio</title>
<link rel="stylesheet" id="theme" href="/theme.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-body);height:100vh;display:grid;
       grid-template-rows:56px 1fr;overflow:hidden}
  h1,h2,h3{font-family:var(--font-display);margin:0}
  button,select,input,textarea{font:inherit;color:inherit}
  .top{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--surface2);background:var(--surface)}
  .logo{font:800 18px var(--font-display);letter-spacing:.5px}
  .logo b{color:var(--accent)}
  .top .sp{flex:1}
  .pill{padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:12px}
  .pill.run{color:var(--bg);background:var(--accent2)}
  .app{display:grid;grid-template-columns:260px 1fr 360px;min-height:0}
  aside,main,.insp{overflow:auto;padding:16px}
  aside{border-right:1px solid var(--surface2);background:var(--surface)}
  .insp{border-left:1px solid var(--surface2);background:var(--surface)}
  .sec{margin-bottom:22px}
  .sec>h3{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:10px}
  .item{padding:9px 11px;border-radius:calc(var(--radius) - 4px);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item:hover{background:var(--surface2)}
  .item.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
  .item small{color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);flex:none}
  .dot.p{background:var(--accent2)} .dot.d{background:var(--accent)}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--surface2);border-radius:10px;padding:8px 10px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:60px;font-family:ui-monospace,monospace;font-size:12px}
  .btn{background:var(--surface2);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
  .btn:hover{filter:brightness(1.2)}
  .btn.pri{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:12px;cursor:pointer;min-height:92px}
  .card:hover{border-color:var(--muted)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card h4{margin:0 0 4px;font:700 14px var(--font-display)}
  .card p{margin:0;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .stage{background:#000;border-radius:var(--radius);overflow:hidden;display:flex;justify-content:center;align-items:center;height:min(46vh,520px)}
  video{max-width:100%;max-height:100%}
  .tabs{display:flex;gap:6px;margin:10px 0}
  .tab{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--surface2);color:var(--text)}
  .tl{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:10px 12px;position:relative}
  .track{display:grid;grid-template-columns:90px 1fr;align-items:center;height:26px;margin:4px 0}
  .track span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .lane{position:relative;height:18px;background:var(--bg);border-radius:6px}
  .blk{position:absolute;top:2px;height:14px;border-radius:4px;cursor:pointer;min-width:3px;opacity:.9}
  .blk:hover{opacity:1;outline:1px solid var(--text)}
  .z{background:var(--accent)} .b{background:var(--accent2)} .m{background:#F59E0B} .s{background:var(--muted)}
  .head{position:absolute;top:0;bottom:0;width:2px;background:var(--text);pointer-events:none;left:90px}
  .log{background:#000;color:#9fe;border-radius:10px;padding:10px;font:12px ui-monospace,monospace;height:150px;overflow:auto;white-space:pre-wrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .stat{background:var(--surface);border:1px solid var(--surface2);border-radius:12px;padding:10px}
  .stat b{display:block;font:800 20px var(--font-display)}
  .stat small{color:var(--muted)}
  .ent{background:var(--bg);border:1px solid var(--surface2);border-radius:12px;padding:10px;margin-bottom:8px}
  .ent.sel{border-color:var(--accent)}
  .ent .row label{font-size:11px;color:var(--muted)}
  .ent input,.ent select{padding:6px 8px;margin-top:4px}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  @media (max-width:1100px){.app{grid-template-columns:220px 1fr}.insp{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Monteur<b>OS</b> <span class="muted" style="font-weight:500">Studio</span></div>
  <span class="pill" id="status">prêt</span>
  <div class="sp"></div>
  <label class="muted" for="themeSel">Charte</label>
  <select id="themeSel" style="width:160px"></select>
</div>
<div class="app">
  <aside>
    <div class="sec"><h3>Rushs</h3><div id="videos"></div>
      <p class="muted" style="font-size:12px">Dépose tes vidéos dans <code id="root"></code></p></div>
    <div class="sec"><h3>Copier un style</h3>
      <textarea id="refs" placeholder="Liens YouTube ou chemins .mp4 (un par ligne)"></textarea>
      <div class="row" style="margin-top:6px"><input id="refName" placeholder="nom du style"><button class="btn" id="cloneBtn">Analyser</button></div>
    </div>
    <div class="sec"><h3>Charte graphique</h3>
      <textarea id="charteSrc" placeholder="Captures d'écran, vidéo ou lien YouTube de l'interface à imiter"></textarea>
      <div class="row" style="margin-top:6px"><input id="charteName" placeholder="nom de la charte"><button class="btn" id="charteBtn">Extraire</button></div>
    </div>
  </aside>

  <main>
    <div id="noproj" class="empty">Sélectionne un rush à gauche pour commencer.</div>
    <div id="proj" hidden>
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 id="title"></h2>
        <div class="row">
          <select id="aspect" style="width:110px"><option value="source">Format source</option><option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option></select>
          <button class="btn" id="prepBtn">1 · Préparer</button>
          <button class="btn" id="brollBtn">2 · B-roll</button>
          <button class="btn pri" id="renderBtn">3 · Rendre</button>
        </div>
      </div>
      <div class="sec"><h3>Format de contenu</h3><div class="cards" id="styles"></div></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
      <div class="stage"><video id="player" controls playsinline></video></div>
      <div class="tl" id="timeline" style="margin-top:12px"></div>
      <div class="sec" style="margin-top:14px"><h3>Console</h3><div class="log" id="log">—</div></div>
    </div>
  </main>

  <div class="insp">
    <div class="sec"><h3>Plan de montage</h3>
      <div class="row"><button class="btn pri" id="saveBtn" disabled>Enregistrer le plan</button>
        <button class="btn" id="rawBtn">JSON brut</button></div>
    </div>
    <div id="inspector" class="muted">Aucun plan — lance « Préparer ».</div>
    <textarea id="raw" hidden style="min-height:60vh"></textarea>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = (u, body) => fetch(u, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {}).then(r => r.json());
let S = {video: null, style: null, project: null, plan: null, sel: null, raw: false};

async function loadState() {
  const st = await api("/api/state");
  $("#root").textContent = st.root;
  $("#videos").innerHTML = st.videos.map(v => `<div class="item ${v.name === S.video ? "on" : ""}" data-v="${v.name}">
     <span>${v.name}</span><span class="dot ${v.done ? "d" : v.prepped ? "p" : ""}" title="${v.done ? "monté" : v.prepped ? "préparé" : "brut"}"></span></div>`).join("")
    || `<div class="muted">Aucune vidéo trouvée.</div>`;
  document.querySelectorAll("#videos .item").forEach(el => el.onclick = () => openProject(el.dataset.v));
  $("#themeSel").innerHTML = st.themes.map(t => `<option ${t === st.theme ? "selected" : ""}>${t}</option>`).join("");
  S.styles = st.styles;
  renderStyles();
}

function renderStyles() {
  const order = ["pub", "ugc", "documentaire", "intro-youtube", "formation", "produit"];
  const list = [...S.styles].sort((a, b) => ((order.indexOf(a.name) + 1) || 99) - ((order.indexOf(b.name) + 1) || 99));
  $("#styles").innerHTML = list.map(s => `<div class="card ${s.name === S.style ? "on" : ""}" data-s="${s.name}">
      <h4>${s.name}</h4><p>${s.description || ""}</p></div>`).join("");
  document.querySelectorAll("#styles .card").forEach(el => el.onclick = () => { S.style = el.dataset.s; renderStyles(); });
}

async function openProject(name) {
  S.video = name;
  const p = await api("/api/project?video=" + encodeURIComponent(name));
  S.project = p; S.plan = p.plan; S.style = S.style && S.video === name ? S.style : (p.style || S.style || "default");
  $("#noproj").hidden = true; $("#proj").hidden = false;
  $("#title").textContent = name;
  const st = p.edl;
  $("#stats").innerHTML = [
    ["Durée brute", st && st.source_duration ? st.source_duration + " s" : "—"],
    ["Après coupe", st && st.kept_duration ? st.kept_duration + " s" : "—"],
    ["Coupes", st && st.segments ? st.segments : "—"],
    ["Visuels", p.plan ? p.plan.broll.filter(b => b.file).length + "/" + p.plan.broll.length : "—"]
  ].map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join("");
  const keys = Object.keys(p.files);
  $("#tabs").innerHTML = keys.map(k => `<div class="tab" data-k="${k}">${{source: "Rush", cut: "Coupé", final: "Final"}[k]}</div>`).join("");
  document.querySelectorAll("#tabs .tab").forEach(el => el.onclick = () => showFile(el.dataset.k));
  showFile(keys.includes("final") ? "final" : keys.includes("cut") ? "cut" : "source");
  renderStyles(); renderPlan(); loadState();
}

function showFile(k) {
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.k === k));
  $("#player").src = S.project.files[k] + "&t=" + Date.now();
}

function renderPlan() {
  const P = S.plan;
  $("#saveBtn").disabled = !P;
  if (!P) { $("#inspector").innerHTML = "Aucun plan — lance « Préparer »."; $("#timeline").innerHTML = ""; return; }
  const D = P.duration || 1, pct = t => (100 * t / D).toFixed(2) + "%";
  const lane = (label, items, cls, kind) => `<div class="track"><span>${label}</span><div class="lane">${items.map((x, i) =>
      `<div class="blk ${cls}" data-k="${kind}" data-i="${i}" title="${x.query || x.text || x.kind || x.name || ""}"
        style="left:${pct(x.start ?? x.t)};width:${pct(Math.max(0.08, Math.min(D, x.end ?? (x.t + .2)) - (x.start ?? x.t)))}"></div>`).join("")}</div></div>`;
  $("#timeline").innerHTML = lane("Zooms", P.zooms, "z", "zooms") + lane("B-roll", P.broll, "b", "broll")
    + lane("Anim.", P.motion, "m", "motion") + lane("SFX +", P.sfx || [], "s", "sfx") + `<div class="head" id="head"></div>`;
  document.querySelectorAll(".blk").forEach(el => el.onclick = () => {
    const it = P[el.dataset.k][+el.dataset.i];
    $("#player").currentTime = it.start ?? it.t; S.sel = el.dataset.k + el.dataset.i; renderInspector();
  });
  renderInspector();
}

function field(sec, i, key, val, opts) {
  const id = `${sec}.${i}.${key}`;
  if (opts) return `<div><label>${key}</label><select data-f="${id}">${opts.map(o => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select></div>`;
  return `<div><label>${key}</label><input data-f="${id}" value="${String(val ?? "").replace(/"/g, "&quot;")}"></div>`;
}

function renderInspector() {
  const P = S.plan;
  if (S.raw) { $("#raw").hidden = false; $("#inspector").hidden = true; $("#raw").value = JSON.stringify(P, null, 2); return; }
  $("#raw").hidden = true; $("#inspector").hidden = false;
  const fmt = t => (+t).toFixed(1) + "s";
  let h = `<div class="ent"><label class="muted">Mots mis en valeur (virgules)</label>
     <input data-f="emphasis_words" value="${(P.emphasis_words || []).join(", ")}"></div>`;
  h += `<h3 class="muted" style="font-size:11px;letter-spacing:1.4px;margin:14px 0 8px">ANIMATIONS</h3>`;
  h += P.motion.map((m, i) => `<div class="ent ${S.sel === "motion" + i ? "sel" : ""}"><div class="muted">${m.type} · ${fmt(m.start)} → ${fmt(m.end)}</div>
     ${m.type === "hyperframes" ? `<div>${m.name}</div>` : field("motion", i, "text", m.text)}</div>`).join("");
  h += `<h3 class="muted" style="font-size:11px;letter-spacing:1.4px;margin:14px 0 8px">ILLUSTRATIONS</h3>`;
  h += P.broll.map((b, i) => `<div class="ent ${S.sel === "broll" + i ? "sel" : ""}">
     <div class="muted">#${i} · ${fmt(b.start)} → ${fmt(b.end)} ${b.file ? "✅" : "⏳"}</div>
     <div class="muted" style="font-size:12px;margin:4px 0">« ${b.context || ""} »</div>
     ${field("broll", i, "query", b.query)}
     <div class="grid2">${field("broll", i, "provider", b.provider, ["auto", "pexels", "pixabay", "wikimedia", "higgsfield", "flow", "veo", "magnific"])}
     ${field("broll", i, "layout", b.layout, ["full", "pip"])}</div>
     ${["higgsfield", "flow", "veo", "magnific"].includes(b.provider) ? field("broll", i, "prompt", b.prompt) : ""}</div>`).join("");
  h += `<h3 class="muted" style="font-size:11px;letter-spacing:1.4px;margin:14px 0 8px">ZOOMS</h3>`;
  h += P.zooms.map((z, i) => `<div class="ent ${S.sel === "zooms" + i ? "sel" : ""}"><div class="grid2">
     ${field("zooms", i, "kind", z.kind, ["punch", "pulse", "ease"])}${field("zooms", i, "scale", z.scale)}</div></div>`).join("");
  $("#inspector").innerHTML = h;
  document.querySelectorAll("[data-f]").forEach(el => el.onchange = () => {
    const path = el.dataset.f.split(".");
    if (path[0] === "emphasis_words") { P.emphasis_words = el.value.split(",").map(s => s.trim()).filter(Boolean); return; }
    const [sec, i, key] = path;
    P[sec][+i][key] = key === "scale" ? parseFloat(el.value) : el.value;
    if (sec === "broll" && key !== "layout") P[sec][+i].file = null;
    renderPlan();
  });
}

async function run(action, extra = {}) {
  const job = await api("/api/run", {action, video: S.video, style: S.style, aspect: $("#aspect").value, ...extra});
  if (job.error) return alert(job.error);
  $("#status").textContent = action + "…"; $("#status").classList.add("run");
  document.querySelectorAll(".btn").forEach(b => b.disabled = true);
  const tick = async () => {
    const j = await api("/api/job?id=" + job.id);
    $("#log").textContent = j.log.join("\n") || "…"; $("#log").scrollTop = 1e9;
    if (j.status === "running") return setTimeout(tick, 1000);
    $("#status").textContent = j.status === "done" ? "terminé ✓" : "erreur"; $("#status").classList.remove("run");
    document.querySelectorAll(".btn").forEach(b => b.disabled = false);
    if (S.video) openProject(S.video); else loadState();
  };
  tick();
}

$("#prepBtn").onclick = () => run("prep");
$("#brollBtn").onclick = async () => { await savePlan(); run("broll"); };
$("#renderBtn").onclick = async () => { await savePlan(); run("render"); };
$("#saveBtn").onclick = () => savePlan(true);
$("#rawBtn").onclick = () => { if (S.raw) { try { S.plan = JSON.parse($("#raw").value); } catch (e) { return alert("JSON invalide"); } } S.raw = !S.raw; renderPlan(); };
async function savePlan(notify) {
  if (!S.plan) return;
  if (S.raw) S.plan = JSON.parse($("#raw").value);
  await api("/api/plan", {video: S.video, plan: S.plan});
  if (notify) { $("#status").textContent = "plan enregistré ✓"; }
}
$("#cloneBtn").onclick = () => run("style", {sources: $("#refs").value.split("\n").map(s => s.trim()).filter(Boolean), name: $("#refName").value || "mon-style"});
$("#charteBtn").onclick = () => run("charte", {sources: $("#charteSrc").value.split("\n").map(s => s.trim()).filter(Boolean), name: $("#charteName").value || "ma-charte"});
$("#themeSel").onchange = async e => { await api("/api/theme", {theme: e.target.value}); $("#theme").href = "/theme.css?name=" + e.target.value + "&t=" + Date.now(); };
$("#player").ontimeupdate = () => {
  const h = $("#head"); if (!h || !S.plan) return;
  const lane = document.querySelector(".lane"); if (!lane) return;
  h.style.left = (lane.offsetLeft + lane.offsetWidth * ($("#player").currentTime / (S.plan.duration || 1))) + "px";
};
loadState();
</script>
</body>
</html>
